name: Android pull request checks

on:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_DEBUG_TOKEN: ${{ secrets.FIREBASE_DEBUG_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download FFmpegKitNext Maven repository
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ffmpegkitnext-android-build.yml
          workflow_conclusion: success
          branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.event.pull_request.base.ref || github.ref_name }}
          name: ffmpeg-kit-next-9.0.2-android-arm64
          path: android-app/ffmpegkitnext-maven
          if_no_artifact_found: fail

      - name: Verify FFmpegKitNext codec configuration
        run: |
          set -euo pipefail
          AAR=android-app/ffmpegkitnext-maven/bundle-android-aar-24-maven/com/arthenica/ffmpeg-kit-next/9.0.2/ffmpeg-kit-next-9.0.2.aar
          test -s "$AAR"
          python3 - "$AAR" <<'PY'
          import sys, zipfile
          data = zipfile.ZipFile(sys.argv[1]).read('jni/arm64-v8a/libavcodec.so')
          required = (b'--enable-libx264', b'--enable-zlib', b'--enable-decoder=png', b'--enable-filter=fade', b'--disable-mediacodec')
          missing = [flag.decode() for flag in required if flag not in data]
          if missing or b'--disable-zlib' in data:
              raise SystemExit(f'FFmpeg AAR has incorrect codec flags; missing={missing}')
          print('Verified FFmpeg AAR: libx264, zlib, PNG decoder, fade filter; MediaCodec disabled.')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Download pinned sherpa-onnx AAR
        working-directory: android-app/app/libs
        run: |
          curl --fail --location --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar \
            --output sherpa-onnx-2.0.1.aar
          echo 'a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  sherpa-onnx-2.0.1.aar' | sha256sum --check

      - name: Run Android JVM unit tests
        working-directory: android-app
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK for compile verification
        working-directory: android-app
        run: ./gradlew --no-daemon assembleDebug
