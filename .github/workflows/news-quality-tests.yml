name: News quality gate tests

on:
  push:
    branches:
      - main
      - world-news/main-quality-gate
      - world-news/image-rights-gate
    paths:
      - "scripts/update_news.py"
      - "scripts/enrich_commons_images.py"
      - "tests/test_commons_images.py"
      - ".github/workflows/update-news.yml"
      - "scripts/enrich_commons_images.py"
      - "tests/test_commons_images.py"
      - "scripts/render_news.py"
      - "scripts/render_seo.py"
      - "scripts/render_articles.py"
      - "scripts/build_site.py"
      - "scripts/render_seo.py"
      - "scripts/render_articles.py"
      - "photos.html"
      - "photos.js"
      - "app.js"
      - "archive.js"
      - "section.js"
      - "index.html"
      - "privacy.html"
      - "archive.html"
      - "section.html"
      - "service-worker.js"
      - "tests/test_update_news.py"
      - "tests/test_news_portal.py"
      - ".github/workflows/update-news.yml"
      - "editorial-policy.html"
      - ".github/workflows/news-quality-tests.yml"
  pull_request:
    paths:
      - "scripts/update_news.py"
      - "scripts/render_news.py"
      - "scripts/render_articles.py"
      - "scripts/render_seo.py"
      - "scripts/build_site.py"
      - "photos.html"
      - "photos.js"
      - "app.js"
      - "archive.js"
      - "section.js"
      - "tests/test_update_news.py"
      - "tests/test_news_portal.py"
      - ".github/workflows/news-quality-tests.yml"

permissions:
  contents: read

jobs:
  news-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run news pipeline and portal tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check browser JavaScript syntax
        run: node --check app.js && node --check photos.js && node --check service-worker.js
      - name: Build the static site
        run: python scripts/build_site.py --output _site
