name: Refresh news archive

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_news.py"
      - "scripts/enrich_commons_images.py"
      - ".github/workflows/update-news.yml"
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-refresh-commons-v2
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      AI_SUMMARIZATION_ENABLED: "false"

    steps:
      - name: Check out public source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public RSS items
        env:
          MAX_NEW_SUMMARIES_PER_RUN: "20"
          MAX_SUMMARIES_PER_DAY: "1000"
          MAX_STORED_ITEMS: "10000"
        run: python scripts/update_news.py

      - name: Find and download verified Wikimedia Commons images
        run: python scripts/enrich_commons_images.py --limit 15 --days 30 --max-attempts 25

      - name: Commit changed archive data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news.json
          find assets/news-images -type f -print0 | xargs -0 -r git add --

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new public news items."
          else
            git commit -m "Update public news archive"

            git pull --rebase origin main

            git push origin HEAD:main

            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
