name: Refresh news archive

on:
  schedule:
    # Best-effort free RSS refresh, offset from the hour boundary.
    - cron: "5,35 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 12
    env:
      AI_SUMMARIZATION_ENABLED: "false"
    steps:
      - name: Check out public source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public RSS items
        env:
          MAX_NEW_SUMMARIES_PER_RUN: "20"
          MAX_SUMMARIES_PER_DAY: "200"
          MAX_STORED_ITEMS: "2000"
        run: python scripts/update_news.py

      - name: Commit changed archive data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new public news items; leaving the already published site available."
          else
            git commit -m "Update public news archive"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        if: steps.commit.outputs.changed == 'true'
        run: python scripts/build_site.py --output _site

      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
