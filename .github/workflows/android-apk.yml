name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Cache sherpa-onnx Android library
        uses: actions/cache@v4
        with:
          path: android-app/app/libs/sherpa-onnx-2.0.1.aar
          key: sherpa-onnx-2.0.1-a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7

      - name: Download pinned sherpa-onnx AAR
        working-directory: android-app/app/libs
        run: |
          curl --fail --location --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar \
            --output sherpa-onnx-2.0.1.aar
          echo 'a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  sherpa-onnx-2.0.1.aar' | sha256sum --check

      - name: Run assistant pipeline unit tests
        working-directory: android-app
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK signature
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.threadsdocumentarynews.app' versionCode='4' versionName='1.3.0'"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: World-News-v1.3.0-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
