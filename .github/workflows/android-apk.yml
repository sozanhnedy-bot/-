name: Build Android APK

on:
  push:
    branches: [main, world-news-sync]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Build FFmpegKitNext Android AAR"]
    types: [completed]
    branches: [main, world-news-sync]

permissions:
  contents: read
  actions: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_DEBUG_TOKEN: ${{ secrets.FIREBASE_DEBUG_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Cache sherpa-onnx Android library
        uses: actions/cache@v6
        with:
          path: android-app/app/libs/sherpa-onnx-2.0.1.aar
          key: sherpa-onnx-2.0.1-a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7

      - name: Download pinned sherpa-onnx AAR
        working-directory: android-app/app/libs
        run: |
          curl --fail --location --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar \
            --output sherpa-onnx-2.0.1.aar
          echo 'a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  sherpa-onnx-2.0.1.aar' | sha256sum --check

      - name: Restore FFmpegKitNext Maven repository
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ffmpegkitnext-android-build.yml
          workflow_conclusion: success
          branch: ${{ github.ref_name }}
          name: ffmpeg-kit-next-9.0.2-android-arm64
          path: android-app/ffmpegkitnext-maven
          if_no_artifact_found: fail

      - name: Verify FFmpegKitNext Maven repository
        run: |
          set -euo pipefail
          REPO=android-app/ffmpegkitnext-maven/bundle-android-aar-24-maven
          POM="$REPO/com/arthenica/ffmpeg-kit-next/9.0.2/ffmpeg-kit-next-9.0.2.pom"
          AAR="$REPO/com/arthenica/ffmpeg-kit-next/9.0.2/ffmpeg-kit-next-9.0.2.aar"
          test -s "$POM"
          test -s "$AAR"
          python3 - "$AAR" <<'PY'
          import sys, zipfile
          data = zipfile.ZipFile(sys.argv[1]).read('jni/arm64-v8a/libavcodec.so')
          required = (b'--enable-libx264', b'--enable-zlib', b'--enable-decoder=png', b'--enable-filter=fade', b'--disable-mediacodec')
          missing = [flag.decode() for flag in required if flag not in data]
          if missing or b'--disable-zlib' in data:
              raise SystemExit(f'FFmpeg AAR has incorrect codec flags; missing={missing}')
          print('Verified FFmpeg AAR: libx264, zlib, PNG decoder, fade filter; MediaCodec disabled.')
          PY
          echo "Verified FFmpegKitNext Maven POM and AAR."
          ls -lh "$POM" "$AAR"

      - name: Verify Release does not contain the Firebase Debug Token
        working-directory: android-app
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:generateReleaseBuildConfig
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = list(Path('app/build/generated/source/buildConfig/release').rglob('BuildConfig.java'))
          if not files or not any(re.search(r'FIREBASE_DEBUG_TOKEN\s*=\s*""', p.read_text()) for p in files):
              raise SystemExit('Release BuildConfig must contain an empty Firebase Debug Token.')
          print('Verified: Firebase Debug Token is empty in Release BuildConfig.')
          PY

      - name: Run assistant pipeline unit tests
        working-directory: android-app
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK signature
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.worldnews.newsapp' versionCode='18' versionName='1.6.10'"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: World-News-v1.6.10-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
