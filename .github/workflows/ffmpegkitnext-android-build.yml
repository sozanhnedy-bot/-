name: Build FFmpegKitNext Android AAR

on:
  workflow_dispatch:
  push:
    branches: [main, world-news-sync]
    paths:
      - ".github/workflows/ffmpegkitnext-android-build.yml"

permissions:
  contents: read

jobs:
  build-android-aar:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Checkout FFmpegKitNext v9.0.2
        uses: actions/checkout@v4
        with:
          repository: arthenica/ffmpeg-kit-next
          ref: v9.0.2
          path: ffmpeg-kit-next
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            cores = 2

      - name: Explicitly enable PNG decoding and World News editor filters
        working-directory: ffmpeg-kit-next
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/android/ffmpeg.sh")
          text = path.read_text()
          marker = "  --disable-autodetect \\\n"
          if marker not in text:
              raise SystemExit("Could not locate FFmpeg Android configure options")
          flags = [
              "--enable-decoder=png",
              "--enable-filter=scale", "--enable-filter=crop", "--enable-filter=pad",
              "--enable-filter=setsar", "--enable-filter=fps", "--enable-filter=format",
              "--enable-filter=overlay", "--enable-filter=eq", "--enable-filter=hue",
              "--enable-filter=colorbalance", "--enable-filter=aresample",
              "--enable-filter=aformat", "--enable-filter=apad", "--enable-filter=atrim",
              "--enable-filter=amix", "--enable-filter=alimiter", "--enable-filter=volume",
              "--enable-filter=afade", "--enable-filter=fade",
          ]
          missing = [flag for flag in flags if flag not in text]
          if missing:
              insertion = "".join(f"  {flag} \\\n" for flag in missing)
              path.write_text(text.replace(marker, marker + insertion, 1))
          PY
          grep -Fq -- "--enable-decoder=png" scripts/android/ffmpeg.sh
          for filter in scale crop pad setsar fps format overlay eq hue colorbalance aresample aformat apad atrim amix alimiter volume afade fade; do
            grep -Fq -- "--enable-filter=$filter" scripts/android/ffmpeg.sh
          done

      - name: Build Android AAR for arm64-v8a
        working-directory: ffmpeg-kit-next
        shell: bash
        run: |
          set -euo pipefail
          ./nix-android.sh -p android-r27d \
            --disable-arch-arm-v7a \
            --disable-arch-arm-v7a-neon \
            --disable-arch-x86 \
            --disable-arch-x86-64 \
            --enable-gpl \
            --enable-lib-x264 \
            --enable-lib-android-zlib

      - name: Verify generated AAR and native ABI
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- "--enable-decoder=png" ffmpeg-kit-next/scripts/android/ffmpeg.sh
          AAR="$(find ffmpeg-kit-next/prebuilt -type f -name 'ffmpeg-kit-next-9.0.2.aar' -print -quit)"
          test -n "$AAR"
          unzip -l "$AAR" | grep -q 'jni/arm64-v8a/'
          unzip -p "$AAR" jni/arm64-v8a/libavcodec.so > /tmp/ffmpeg-libavcodec.so
          strings /tmp/ffmpeg-libavcodec.so | grep -Fq -- '--enable-libx264'
          strings /tmp/ffmpeg-libavcodec.so | grep -Fq -- '--enable-decoder=png'
          strings /tmp/ffmpeg-libavcodec.so | grep -Fq -- '--enable-zlib'
          if strings /tmp/ffmpeg-libavcodec.so | grep -Fq -- '--disable-zlib'; then
            echo "FFmpeg was built without zlib; PNG decoder cannot be used." >&2
            exit 1
          fi
          strings /tmp/ffmpeg-libavcodec.so | grep -Fq -- "--disable-mediacodec"
          for filter in scale crop pad setsar fps format overlay eq hue colorbalance aresample aformat apad atrim amix alimiter volume afade fade; do
            strings /tmp/ffmpeg-libavcodec.so | grep -Fq -- "--enable-filter=$filter"
          done
          echo "FFmpegKitNext AAR: $AAR"
          echo "Verified arm64-v8a AAR with PNG decoder, zlib, libx264, editor and fade filters, and no MediaCodec dependency."

      - name: Upload AAR and Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-next-9.0.2-android-arm64
          path: |
            ffmpeg-kit-next/prebuilt/bundle-android-aar-*-maven/
          if-no-files-found: error
          retention-days: 90
