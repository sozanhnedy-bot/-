name: Deploy YouTube Lab Worker

on:
  push:
    branches:
      - main
    paths:
      - "youtube-auto-open-worker/**"
      - ".github/workflows/deploy-youtube-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-lab-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: youtube-auto-open-worker
          command: deploy
