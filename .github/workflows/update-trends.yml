name: Refresh trends radar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trends-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch recent trends
        run: python scripts/update_trends.py
      - name: Commit radar snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends.json
          if git diff --cached --quiet; then
            echo "No radar changes."
            exit 0
          fi
          git commit -m "Refresh trends radar snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"
