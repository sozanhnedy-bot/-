<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Auto Open</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#14243a;--line:#2b405b;--text:#edf4ff;--muted:#9aabc0;--accent:#2dd4c2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 80% -10%,#244768 0%,transparent 45%),linear-gradient(180deg,#0b1220,#0b0f1a);color:var(--text);font-family:system-ui,sans-serif;line-height:1.65}.wrap{max-width:850px;margin:32px auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 40px #0006}h1{text-align:center;color:var(--accent);margin:0 0 6px}.sub{text-align:center;color:var(--muted);margin:0 0 24px}.panel{background:#0b1728;border:1px solid var(--line);border-radius:16px;padding:22px}label{display:block;color:var(--muted);margin:12px 0 6px}input{width:100%;padding:13px;border:2px solid var(--line);border-radius:11px;background:#0b1728;color:var(--text);font-size:16px}input:focus{outline:none;border-color:var(--accent)}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.count{flex:1;min-width:150px}button{padding:13px 18px;border:1px solid var(--line);border-radius:12px;background:#203752;color:var(--text);font-weight:700;cursor:pointer}button.primary{background:var(--accent);color:#081521;border-color:var(--accent)}button:disabled{opacity:.5;cursor:not-allowed}.counter{text-align:center;font-size:28px;font-weight:800;color:var(--accent);margin:18px 0 8px;direction:ltr}.progress{height:8px;background:#07101d;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);transition:width .2s}.status{text-align:center;min-height:28px}.note{font-size:13px;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<main class="wrap">
<h1>YouTube Auto Open</h1>
<p class="sub">افتح رابط الفيديو في عدد التبويبات اللي تحدده</p>
<section class="panel">
<label for="videoUrl">رابط فيديو يوتيوب</label>
<input id="videoUrl" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="url">
<div class="row">
<div class="count"><label for="tabCount">عدد التبويبات (1–100)</label><input id="tabCount" type="number" min="1" max="100" value="5"></div>
<button class="primary" id="start">بدء الفتح</button>
<button id="stop" disabled>إيقاف</button>
</div>
<div class="counter" id="counter">0 / 0</div>
<div class="progress"><div class="fill" id="bar"></div></div>
<p class="status" id="status" aria-live="polite">جاهز. أدخل الرابط والعدد المطلوب.</p>
<p class="note">ملاحظة: المتصفح قد يمنع فتح عدد كبير من التبويبات. اسمح بالنوافذ المنبثقة لهذا الموقع عند ظهور التنبيه. لا يمكن ضمان التشغيل التلقائي بسبب سياسات YouTube والمتصفح.</p>
</section>
</main>
<script>
(() => {
 const urlInput=document.getElementById('videoUrl');
 const countInput=document.getElementById('tabCount');
 const startBtn=document.getElementById('start');
 const stopBtn=document.getElementById('stop');
 const status=document.getElementById('status');
 const counter=document.getElementById('counter');
 const bar=document.getElementById('bar');
 let stopped=false,opened=0,total=0,running=false;
 const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 function update(){counter.textContent=opened+' / '+total;bar.style.width=(total?opened/total*100:0)+'%';}
 function validYouTube(value){
  try{const u=new URL(value);return ['youtube.com','www.youtube.com','m.youtube.com','youtu.be','www.youtube-nocookie.com'].includes(u.hostname)&&['http:','https:'].includes(u.protocol);}
  catch{return false;}
 }
 async function start(){
  if(running)return;
  const video=urlInput.value.trim();
  const amount=Number(countInput.value);
  if(!validYouTube(video)){status.textContent='أدخل رابط يوتيوب صحيحًا.';return;}
  if(!Number.isInteger(amount)||amount<1||amount>100){status.textContent='العدد لازم يكون من 1 إلى 100.';return;}
  running=true;stopped=false;opened=0;total=amount;update();
  startBtn.disabled=true;stopBtn.disabled=false;
  for(let i=0;i<amount;i++){
   if(stopped)break;
   const tab=window.open(video,'_blank');
   if(!tab){status.textContent='المتصفح منع فتح تبويب جديد. اسمح بالنوافذ المنبثقة ثم أعد المحاولة.';break;}
   opened++;update();status.textContent='تم فتح '+opened+' من '+total+' تبويب.';
   await sleep(600);
  }
  running=false;startBtn.disabled=false;stopBtn.disabled=true;
  if(stopped)status.textContent='تم الإيقاف بعد فتح '+opened+' تبويب.';
  else if(opened===total)status.textContent='اكتمل فتح '+opened+' تبويب.';
 }
 startBtn.addEventListener('click',start);
 stopBtn.addEventListener('click',()=>{stopped=true;stopBtn.disabled=true;});
 update();
})();
</script>
</body>
</html>
