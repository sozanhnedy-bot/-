plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def firebaseLocalProperties = new Properties()
def firebaseLocalPropertiesFile = rootProject.file('local.properties')
if (firebaseLocalPropertiesFile.exists()) {
    firebaseLocalPropertiesFile.withInputStream { firebaseLocalProperties.load(it) }
}
def firebaseValue = { String propertyName, String environmentName ->
    (firebaseLocalProperties.getProperty(propertyName) ?: System.getenv(environmentName) ?: '').trim()
}
def asBuildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'com.threadsdocumentarynews.app'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.worldnews.newsapp'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '1.6.3'
        ndk { abiFilters 'arm64-v8a' }
        buildConfigField 'String', 'FIREBASE_API_KEY', asBuildConfigString(firebaseValue('firebase.apiKey', 'FIREBASE_API_KEY'))
        buildConfigField 'String', 'FIREBASE_APP_ID', asBuildConfigString(firebaseValue('firebase.appId', 'FIREBASE_APP_ID'))
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', asBuildConfigString(firebaseValue('firebase.projectId', 'FIREBASE_PROJECT_ID'))
        buildConfigField 'String', 'FIREBASE_DEBUG_TOKEN', asBuildConfigString(firebaseValue('firebase.debugToken', 'FIREBASE_DEBUG_TOKEN'))
        resValue 'string', 'firebase_app_check_debug_token', firebaseValue('firebase.debugToken', 'FIREBASE_DEBUG_TOKEN')
        manifestPlaceholders = [
            firebaseAppCheckDebugToken: firebaseValue('firebase.debugToken', 'FIREBASE_DEBUG_TOKEN')
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }
    packaging { jniLibs { useLegacyPackaging = true } }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-ai'
    implementation 'com.google.firebase:firebase-appcheck'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation files('libs/sherpa-onnx-2.0.1.aar')
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'androidx.media3:media3-transformer:1.9.0'
    implementation 'androidx.media3:media3-effect:1.9.0'
    implementation 'androidx.media3:media3-common:1.9.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
